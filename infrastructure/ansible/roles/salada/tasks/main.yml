---
- name: Assert Padinho's runtime database configuration is provided
  ansible.builtin.assert:
    that:
      - padinho_database_host | length > 0
      - padinho_database_port | int > 0
      - padinho_database_user | length > 0
      - padinho_database_password | length > 0
      - padinho_database_name | length > 0
      - padinho_database_max_open | int > 0
      - padinho_database_max_idle | int >= 0
      - padinho_database_max_lifetime | length > 0
    fail_msg: Fill the production inventory and encrypted host variables.

- name: Create Salada configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ salada_directory }}"
      mode: "0755"
    - path: "{{ salada_environment_directory }}"
      mode: "0700"

- name: Write Salada's environment file
  ansible.builtin.copy:
    dest: "{{ salada_environment_file }}"
    content: |
      DB_HOST={{ padinho_database_host | string | to_json }}
      DB_PORT={{ padinho_database_port }}
      DB_USER={{ padinho_database_user | string | to_json }}
      DB_PASSWORD={{ padinho_database_password | string | to_json }}
      DB_NAME={{ padinho_database_name | string | to_json }}
      DB_MAX_OPEN={{ padinho_database_max_open }}
      DB_MAX_IDLE={{ padinho_database_max_idle }}
      DB_MAX_LIFETIME={{ padinho_database_max_lifetime | string | to_json }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the Compose declaration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../discord/padinho/compose.yaml"
    dest: "{{ salada_directory }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Reconcile Salada and Watchtower
  community.docker.docker_compose_v2:
    project_src: "{{ salada_directory }}"
    pull: always
    remove_orphans: true
    state: present
  environment:
    SALADA_ENV_FILE: "{{ salada_environment_file }}"
    SALADA_IMAGE: "{{ salada_image }}"
