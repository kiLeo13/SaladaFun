name: SaladaFun
version: '${project.version}'
main: sld.saladafun.platform.purpur.SaladaFunPlugin
api-version: '26.2'
authors: [Leo13]
description: Shared vitals, batch-breaking, and Discord chat features for Purpur.

commands:
  shared:
    description: Manage shared health, food, and potion effects.
    usage: /shared <health|food|effects> <enable|disable|status|resume>
  batchbreaking:
    description: Configure batch breaking.
    usage: /batchbreaking <get|set>
    permission: saladafun.batchbreaking.manage
  saladafun:
    description: Manage the SaladaFun plugin.
    usage: /saladafun reloadconfig
    permission: saladafun.reloadconfig

permissions:
  saladafun.shared.health.manage:
    description: Enables management of shared health.
    default: op
  saladafun.shared.food.manage:
    description: Enables management of shared food.
    default: op
  saladafun.shared.effects.manage:
    description: Enables management of shared potion effects.
    default: op
  saladafun.batchbreaking.manage:
    description: Enables management of the batch-breaking range.
    default: op
  saladafun.batchbreaking.use:
    description: Enables batch-breaking behavior for a player.
    default: true
  saladafun.reloadconfig:
    description: Enables validated runtime configuration reloads.
    default: op
