plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'com.gradleup.shadow' version '8.3.6'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def modResourceProperties = [
    mod_id: mod_id,
    mod_version: mod_version,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_authors: mod_authors,
    mod_description: mod_description
]

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

configurations {
    jdaRelocation {
        canBeConsumed = false
        canBeResolved = true
    }
}

/*
 * JDA needs Commons Collections. Relocating that package into JDA's private
 * nested JAR prevents package collisions with Iris and other NeoForge mods.
 */
def relocateJda = tasks.register(
    'relocateJda',
    com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
) {
    archiveBaseName = 'discord-utils-jda'
    archiveVersion = jda_version
    archiveClassifier = 'relocated'
    configurations = [project.configurations.jdaRelocation]
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    manifest {
        attributes 'Automatic-Module-Name': 'sld.saladafun.discordutils.jda'
    }
    relocate(
        'org.apache.commons.collections4',
        'sld.saladafun.discordutils.shaded.commonscollections4'
    )
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'

    implementation("net.dv8tion:JDA:${jda_version}") {
        // Production uses the relocated JDA bundle declared below.
        transitive = false
    }
    testRuntimeOnly "net.dv8tion:JDA:${jda_version}"

    jdaRelocation("net.dv8tion:JDA:${jda_version}") {
        transitive = false
    }
    jdaRelocation 'org.apache.commons:commons-collections4:4.5.0'

    jarJar files(relocateJda)

    // Jar-in-Jar does not follow JDA's transitive dependency graph. Keep the
    // production artifact self-contained by declaring JDA's required runtime
    // libraries explicitly. Versions mirror JDA 6.4.1's published metadata.
    [
        'net.sf.trove4j:core:3.1.0',
        'com.fasterxml.jackson.core:jackson-annotations:2.21',
        'com.fasterxml.jackson.core:jackson-core:2.21.2',
        'com.fasterxml.jackson.core:jackson-databind:2.21.2',
        'com.google.crypto.tink:tink:1.18.0',
        // NeoForge already provides this module through Guava. Embedding it
        // again makes JDA resolve two modules named jsr305.
        // 'com.google.code.findbugs:jsr305:3.0.2',
        // NeoForge already provides this module. Embedding a second copy makes
        // Java reject JDA because it reads duplicate error-prone annotations.
        // 'com.google.errorprone:error_prone_annotations:2.22.0',
        'com.google.protobuf:protobuf-java:4.28.2',
        'com.neovisionaries:nv-websocket-client:2.14',
        'com.squareup.okhttp3:okhttp-jvm:5.3.2',
        'com.squareup.okio:okio:3.16.4',
        'com.squareup.okio:okio-jvm:3.16.4',
        'org.jetbrains:annotations:13.0',
        'club.minnced:opus-java:1.1.1',
        'club.minnced:opus-java-api:1.1.1',
        'club.minnced:opus-java-natives:1.1.1'
    ].each { dependencyNotation ->
        jarJar(dependencyNotation) {
            version {
                strictly "[${dependencyNotation.tokenize(':').last()}]"
                prefer dependencyNotation.tokenize(':').last()
            }
        }
    }

    // OkHttp and Okio require Kotlin. Bundle the version used by JDA as a
    // fallback, but allow NeoForge to select a newer shared copy supplied by
    // Kotlin for Forge or another mod.
    jarJar('org.jetbrains.kotlin:kotlin-stdlib:2.2.21') {
        version {
            strictly '[2.2.21,)'
            prefer '2.2.21'
        }
    }

    additionalRuntimeClasspath "net.dv8tion:JDA:${jda_version}"
}

tasks.named('test') {
    useJUnitPlatform()
    def testRunDirectory = layout.buildDirectory.dir('test-run')
    workingDir testRunDirectory
    doFirst {
        testRunDirectory.get().asFile.mkdirs()
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(modResourceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modResourceProperties)
    }
}

tasks.register('verifyModMetadata') {
    group = 'verification'
    description = 'Verifies that the packaged NeoForge metadata contains no Gradle placeholders.'
    dependsOn tasks.named('jar')

    doLast {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        def metadata = new java.util.zip.ZipFile(modJar).withCloseable { archive ->
            def entry = archive.getEntry('META-INF/neoforge.mods.toml')
            if (entry == null) {
                throw new GradleException('The packaged mod is missing META-INF/neoforge.mods.toml.')
            }

            archive.getInputStream(entry).getText('UTF-8')
        }

        if (metadata.contains('${')) {
            throw new GradleException('The packaged NeoForge metadata still contains Gradle placeholders.')
        }
        if (!metadata.contains("modId=\"${mod_id}\"")) {
            throw new GradleException('The packaged NeoForge metadata has an unexpected mod ID.')
        }
    }
}

tasks.register('verifyRuntimePackaging') {
    group = 'verification'
    description = 'Verifies that Kotlin is packaged as a negotiable runtime fallback.'
    dependsOn tasks.named('jar')

    doLast {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(modJar).withCloseable { archive ->
            def metadataEntry = archive.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('The packaged mod is missing Jar-in-Jar metadata.')
            }

            def metadataText = archive.getInputStream(metadataEntry).withCloseable { stream ->
                stream.getText('UTF-8')
            }
            def metadata = new groovy.json.JsonSlurper().parseText(metadataText)
            def kotlinStdlib = metadata.jars.find { nestedJar ->
                nestedJar.identifier.group == 'org.jetbrains.kotlin' &&
                    nestedJar.identifier.artifact == 'kotlin-stdlib'
            }

            if (kotlinStdlib == null) {
                throw new GradleException('The packaged mod is missing its Kotlin standard-library fallback.')
            }
            if (kotlinStdlib.version.range != '[2.2.21,)') {
                throw new GradleException(
                    "The Kotlin standard-library range must be [2.2.21,), but was ${kotlinStdlib.version.range}."
                )
            }
            if (kotlinStdlib.version.artifactVersion != '2.2.21') {
                throw new GradleException(
                    "The bundled Kotlin fallback must be 2.2.21, but was ${kotlinStdlib.version.artifactVersion}."
                )
            }
            if (archive.getEntry(kotlinStdlib.path) == null) {
                throw new GradleException(
                    "The Kotlin fallback declared at ${kotlinStdlib.path} is missing from the packaged mod."
                )
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModMetadata')
    dependsOn tasks.named('verifyRuntimePackaging')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
