shared-inventory:
  # Controls what happens to the shared inventory when a participant dies.
  # Values:
  # - FOLLOW_GAMERULE: follow the world's effective keep-inventory result.
  # - DROPS_ON_DEATH: clear it globally and produce one normal set of drops.
  # - FADES_ON_DEATH: clear it globally without dropping the items.
  # - KEEPS_ON_DEATH: retain it and suppress shared-inventory drops.
  death-behavior: FOLLOW_GAMERULE

  # Controls whether Paper's items-to-keep list is restored after a death clear.
  # Values:
  # - true: reinsert retained items into the shared inventory.
  # - false: ignore retained items and apply the cleared shared inventory.
  respect-items-to-keep: true

batch-breaking:
  # Controls which matching blocks are included after the original break.
  # Values:
  # - disabled: do not break additional blocks.
  # - all: search all chunks currently sent to the player.
  # - Positive integer: search within that inclusive cubic radius in blocks.
  setting: disabled

  # Controls how each additional matching block is broken.
  # Values:
  # - PLAYER_TOOL: use the player's tool, drops, experience, and break event.
  # - NATURAL_DROPS: use natural no-tool drops without a player break event.
  # - NO_DROPS: use a player break event but suppress items and experience.
  # Generated player breaks never change food, saturation, or exhaustion.
  additional-block-action: PLAYER_TOOL

  # Applies to PLAYER_TOOL and NO_DROPS; NATURAL_DROPS uses no tool.
  # Values:
  # - SINGLE_USE: only the original block break consumes durability.
  # - PER_BLOCK: every successful additional break may consume durability.
  tool-durability: SINGLE_USE

  # Controls how batches are executed.
  # Values:
  # - ASYNC: search off-thread and apply changes in responsive main-thread batches.
  # - SYNC: finish in one main-thread operation; large jobs will freeze the server.
  sync-batching: ASYNC

  # Applies the configured range to same-species animals killed by a player.
  # Values:
  # - true: include matching animals; "all" uses chunks sent to the player.
  # - false: batch only blocks and bucket-filled water.
  include-animals: false

discord-chat:
  # Bridges accepted Minecraft player chat and one Discord text channel.
  # Keep this disabled until all three values below are configured.
  enabled: false

  # The Discord bot token. Treat this as a secret and never commit a populated value.
  token: ""

  # Incoming webhook used for Minecraft -> Discord messages.
  # Treat the webhook URL as a secret because it contains its own credential.
  webhook-url: ""

  # Text-channel snowflake from which the bot accepts Discord -> Minecraft messages.
  channel-id: ""
